name: Clínicas Brasília screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      matrix:
        device:
          - name: iPhone 17
            slug: iphone
          - name: iPad Air 13-inch (M4)
            slug: ipad
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Run screenshot UI tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ClinicasBrasilia.xcodeproj \
            -scheme ClinicasBrasilia \
            -destination 'platform=iOS Simulator,name=${{ matrix.device.name }},OS=26.5' \
            -resultBundlePath "$RUNNER_TEMP/clinicas-${{ matrix.device.slug }}.xcresult" \
            -only-testing:ClinicasBrasiliaUITests \
            CODE_SIGNING_ALLOWED=NO
      - name: Export PNG attachments
        run: |
          set -euo pipefail
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/clinicas-${{ matrix.device.slug }}.xcresult" \
            --output-path "$RUNNER_TEMP/clinicas-screenshots-${{ matrix.device.slug }}"
          find "$RUNNER_TEMP/clinicas-screenshots-${{ matrix.device.slug }}" -type f -name '*.png' -print
      - uses: actions/upload-artifact@v4
        with:
          name: clinicas-brasilia-screenshots-${{ matrix.device.slug }}
          path: ${{ runner.temp }}/clinicas-screenshots-${{ matrix.device.slug }}
